        :root {
            --primary: #0D7A53;
            --primary-light: #E7F6ED;
            --surface: #FFFFFF;
            --background: #F8FAFC;
            --ink: #0F172A;
            --ink-soft: #64748B;
            --border: #E2E8F0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--background);
            color: var(--ink);
            padding: 2rem 1rem;
        }

        .container { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem; }
        .header p { color: var(--ink-soft); }

        .controls {
            display: flex; gap: 1rem; margin-bottom: 1.5rem;
        }
        .search-box {
            flex: 1; padding: 1rem 1.5rem; font-size: 1rem;
            border: 1px solid var(--border); border-radius: 12px; outline: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); font-family: inherit;
        }
        .search-box:focus { border-color: var(--primary); }

        .table-container {
            background: var(--surface); border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
        th { background-color: #F1F5F9; font-weight: 600; color: var(--ink-soft); white-space: nowrap; }
        tr:hover { background-color: #F8FAFC; }

        .badge {
            padding: 0.25rem 0.75rem; border-radius: 999px;
            font-size: 0.875rem; font-weight: 600;
        }
        .cat-makanan { background: #E7F6ED; color: #0D7A53; }
        .cat-lauk { background: #FEE2E2; color: #B91C1C; }
        .cat-sayur { background: #DCFCE7; color: #047857; }
        .cat-kudapan { background: #FFF7ED; color: #C2410C; }
        .cat-minuman { background: #EFF6FF; color: #4338CA; }

        .macro { font-weight: 600; }
        .kal { color: var(--primary); }
        .empty-state { text-align: center; padding: 3rem; color: var(--ink-soft); display: none; }

        /* Paginasi */
        .pagination {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 1.5rem; background: var(--surface);
            border-top: 1px solid var(--border); border-radius: 0 0 12px 12px;
        }
        .page-info { color: var(--ink-soft); font-size: 0.9rem; }
        .page-buttons { display: flex; gap: 0.5rem; }
        .btn-page {
            padding: 0.5rem 1rem; border: 1px solid var(--border);
            background: var(--surface); border-radius: 8px; cursor: pointer;
            font-family: inherit; font-weight: 600; color: var(--ink);
            transition: all 0.2s;
        }
        .btn-page:hover:not(:disabled) { background: #F1F5F9; }
        .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }

    </style>
</head>

    // LOGIKA PAGINASI & PENCARIAN
    let filteredData = [...foodDatabase];
    let currentPage = 1;
    const itemsPerPage = 50;

    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const emptyState = document.getElementById('emptyState');
    const pageInfo = document.getElementById('pageInfo');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');

    function renderTable() {
        tableBody.innerHTML = '';
        const totalItems = filteredData.length;
        
        if (totalItems === 0) {
            emptyState.style.display = 'block';
            pageInfo.innerText = "Menampilkan 0 data";
            btnPrev.disabled = true;
            btnNext.disabled = true;
            return;
        }

        emptyState.style.display = 'none';

        const totalPages = Math.ceil(totalItems / itemsPerPage);
        if (currentPage > totalPages) currentPage = totalPages;

        const startIdx = (currentPage - 1) * itemsPerPage;
        const endIdx = Math.min(startIdx + itemsPerPage, totalItems);
        const paginatedData = filteredData.slice(startIdx, endIdx);

        paginatedData.forEach(item => {
            let badgeClass = '';
            if (item.cat === 'Makanan') badgeClass = 'cat-makanan';
            if (item.cat === 'Lauk') badgeClass = 'cat-lauk';
            if (item.cat === 'Sayur') badgeClass = 'cat-sayur';
            if (item.cat === 'Kudapan') badgeClass = 'cat-kudapan';
            if (item.cat === 'Minuman') badgeClass = 'cat-minuman';

            const row = `
                <tr>
                    <td style="font-weight: 500;">${item.name}</td>
                    <td><span class="badge ${badgeClass}">${item.cat}</span></td>
                    <td style="color: var(--ink-soft); font-size: 0.9rem;">${item.serving}</td>
                    <td class="macro kal">${item.cal}</td>
                    <td class="macro">${item.pro}</td>
                    <td class="macro">${item.carb}</td>
                    <td class="macro">${item.fat}</td>
                </tr>
            `;
            tableBody.insertAdjacentHTML('beforeend', row);
        });

        pageInfo.innerText = `Menampilkan ${startIdx + 1}-${endIdx} dari ${totalItems} data`;
        btnPrev.disabled = currentPage === 1;
        btnNext.disabled = currentPage === totalPages;
    }

    searchInput.addEventListener('input', function(e) {
        const keyword = e.target.value.toLowerCase();
        filteredData = foodDatabase.filter(food => 
            food.name.toLowerCase().includes(keyword) || 
            food.cat.toLowerCase().includes(keyword)
        );
        currentPage = 1; // Reset ke halaman 1 saat mencari
        renderTable();
    });

    btnPrev.addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; renderTable(); }
    });

    btnNext.addEventListener('click', () => {
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);
        if (currentPage < totalPages) { currentPage++; renderTable(); }
    });

    // Inisialisasi
    renderTable();
</script>
</body>
</html>
